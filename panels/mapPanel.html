<div class="panel" id="mapPanel"><div class="card map-game-card"><div class="activity-panel-head"><div><h2 class="section-title">🗺️ Патрул из Пловдив</h2><p class="tiny">Избери продължителност и натисни директно върху квартала на картата.</p></div><div id="patrolActivitySlot" class="patrol-activity-slot"></div></div><div class="field"><label>Продължителност</label><select id="patrolDuration"><option value="30">30 минути</option><option selected="" value="60">1 час</option><option value="120">2 часа</option></select></div><div class="plovdiv-game-map"><button class="map-hotspot kyuchuka" type="button" aria-label="Кючука" onclick="patrol('Кючук Париж')"></button><button class="map-hotspot karshiyaka" type="button" aria-label="Кършияка" onclick="patrol('Кършияка')"></button><button class="map-hotspot center" type="button" aria-label="Център" onclick="patrol('Главната')"></button><button class="map-hotspot trakia" type="button" aria-label="Тракия" onclick="patrol('Тракия')"></button><button class="map-hotspot smirnenski" type="button" aria-label="Смирненски" onclick="patrol('Смирненски')"></button><button class="map-hotspot komatevo" type="button" aria-label="Коматево" onclick="patrol('Коматево')"></button></div><div class="map-result"><h2 class="section-title">📜 Какво стана?</h2><div class="log" id="log">Влезе в квартала. Засега е подозрително спокойно.</div></div></div><style>.activity-panel-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px);gap:22px;align-items:start}.patrol-activity-slot{display:flex;justify-content:flex-end;margin:0}.patrol-activity-slot:empty{display:none}.patrol-activity-slot #activityCard{width:100%;margin:0;padding:10px 12px;border-radius:10px;text-align:left;box-shadow:none}.patrol-activity-slot #activityCard #activityTitle{display:block;margin-bottom:3px}.patrol-activity-slot #activityCard #activitySub{font-size:12px;color:#c8c3c7}.patrol-activity-slot #activityCard #activityTimer{display:inline-block;margin:8px 8px 0 0
