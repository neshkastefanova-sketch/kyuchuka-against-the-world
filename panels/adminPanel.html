<div class="panel" id="adminPanel"><div class="card admin-card"><div class="admin-head"><div><h2 class="section-title">🔐 Админ панел</h2><p class="tiny">Само за администратор. Данните за имейлите не се показват никъде публично в играта.</p></div><button onclick="loadAdminUsers()">↻ Обнови</button></div><div class="admin-summary"><div><span>👥 Реални регистрации</span><b id="adminHumanCount">0</b></div><div><span>🤖 NPC</span><b id="adminBotCount">0</b></div><div><span>✅ Потвърдени имейли</span><b id="adminConfirmedCount">0</b></div></div><div class="admin-tools"><input id="adminSearch" placeholder="Търси по герой или имейл" oninput="renderAdminUsers()"><label><input id="adminShowBots" type="checkbox" onchange="renderAdminUsers()"> Покажи NPC</label></div><div id="adminUsers" class="admin-users"><div class="msg">Зареждане...</div></div></div><style>.admin-card{border-top:3px solid #8d67ff!important}.admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.admin-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.admin-summary>div{background:#17151a;border:1px solid #3d3840;border-radius:10px;padding:10px}.admin-summary span{display:block;color:#aaaab4;font-size:11px}.admin-summary b{display:block;font-size:22px;margin-top:4px}.admin-tools{display:flex;gap:10px;align-items:center;margin-bottom:12px}.admin-tools input[type=text],#adminSearch{flex:1;background:#0f0f12;border:1px solid #48434a;color:white;padding:11px;border-radius:9px}.admin-users{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{padding:10px 8px;border-bottom:1px solid #302d33;text-align:left;font-size:12px}.admin-table th{color:#aaaab4;font-size:11px}.admin-email{font-family:monospace}.admin-npc{opacity:.7}@media(max-width:700px){.admin-summary{grid-template-columns:1fr}.admin-head,.admin-tools{align-items:stretch;flex-direction:column}}</style></div>
