<div class="panel active" id="streets"><div class="card streets-card"><div class="streets-head"><div><h2 class="section-title">⚔️ Уличките</h2><div class="tiny">Избери къде да се завъртиш из квартала.</div></div><span class="streets-status">📍 Кючука</span></div><div class="streets-scene"><div class="streets-map"><button class="street-hotspot venus" type="button" aria-label="Дискотека Венера" onclick="selectStreetSpot('Дискотека Венера','Нощният живот на Кючука. Тук се събират всякакви образи.')"></button><button class="street-hotspot blocks" type="button" aria-label="Междублоковото" onclick="selectStreetSpot('Междублоковото','Тук се въртят играчи около твоето ниво.')"></button><button class="street-hotspot dark-alley" type="button" aria-label="Тъмната уличка" onclick="selectStreetSpot('Тъмната уличка','По-опасно е, но тук се търсят истинските проблеми.')"></button><button class="street-hotspot cafe" type="button" aria-label="Кафето" onclick="selectStreetSpot('Кафето','Кварталните лица са се събрали на кафе.')"></button><button class="street-hotspot court" type="button" aria-label="Игрището" onclick="selectStreetSpot('Игрището','Мястото на агитките. Скоро тук ще има специални сблъсъци.')"></button><button class="street-hotspot stop" type="button" aria-label="Спирката" onclick="selectStreetSpot('Спирката','Тук най-често се появяват хора от The World.')"></button><button class="street-hotspot police" type="button" aria-label="Районното — скоро" disabled></button></div></div><div class="street-encounters"><div class="street-encounter-head"><div><h3 id="streetSpotTitle">Играчите наоколо</h3><div class="tiny" id="streetSpotText">Избери място или предизвикай някого директно.</div></div></div><div class="players" id="players"></div></div></div><div class="card streets-ranking"><h2 class="section-title">🏆 Класация</h2><div class="players" id="leaderboard"></div></div></div>
<script>function selectStreetSpot(name,text){const title=document.getElementById('streetSpotTitle'),sub=document.getElementById('streetSpotText');if(title)title.textContent=name;if(sub)sub.textContent=text;document.querySelectorAll('.street-hotspot').forEach(x=>x.classList.remove('selected'));if(event&&event.currentTarget)event.currentTarget.classList.add('selected');document.querySelector('.street-encounters')?.scrollIntoView({behavior:'smooth',block:'nearest'})}</script>
