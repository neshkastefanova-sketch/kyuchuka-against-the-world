<div class="panel active" id="streets"><div class="card streets-card"><div class="streets-head"><div><h2 class="section-title">⚔️ Уличките</h2><div class="tiny">Избери къде да се завъртиш из квартала.</div></div><span class="streets-status">📍 Кючука</span></div><div class="streets-scene"><button class="street-place blocks" type="button" onclick="selectStreetSpot('Междублоковото','Тук се въртят играчи около твоето ниво.')"><b>🏘️ Междублоковото</b><small>Бой на твоя територия</small></button><button class="street-place cafe" type="button" onclick="selectStreetSpot('Кафето','Кварталните лица са се събрали на кафе.')"><b>☕ Кафето</b><small>Местните са тук</small></button><button class="street-place dark-alley" type="button" onclick="selectStreetSpot('Тъмната уличка','По-опасно е, но тук се търсят истинските проблеми.')"><b>🌙 Тъмната уличка</b><small>По-рискови срещи</small></button><button class="street-place stop" type="button" onclick="selectStreetSpot('Спирката','Тук най-често се появяват хора от The World.')"><b>🚏 Спирката</b><small>The World идва насам</small></button><button class="street-place court" type="button" onclick="selectStreetSpot('Игрището','Мястото на агитките. Скоро тук ще има специални сблъсъци.')"><b>🏟️ Игрището</b><small>Агитки и квартален респект</small></button><button class="street-place venus" type="button" onclick="selectStreetSpot('Дискотека Венера','Нощният живот на Кючука. Тук се събират всякакви образи.')"><b>🪩 Дискотека „Венера“</b><small>Нощен живот и всякакви образи</small></button><button class="street-place police" type="button" disabled><b>🚓 Районното</b><small>Скоро</small></button></div><div class="street-encounters"><div class="street-encounter-head"><div><h3 id="streetSpotTitle">Играчите наоколо</h3><div class="tiny" id="streetSpotText">Избери място или предизвикай някого директно.</div></div></div><div class="players" id="players"></div></div></div><div class="card streets-ranking"><h2 class="section-title">🏆 Класация</h2><div class="players" id="leaderboard"></div></div></div>
<script>function selectStreetSpot(name,text){const title=document.getElementById('streetSpotTitle'),sub=document.getElementById('streetSpotText');if(title)title.textContent=name;if(sub)sub.textContent=text;document.querySelectorAll('.street-place').forEach(x=>x.classList.remove('selected'));if(event&&event.currentTarget)event.currentTarget.classList.add('selected');document.querySelector('.street-encounters')?.scrollIntoView({behavior:'smooth',block:'nearest'})}</script>
